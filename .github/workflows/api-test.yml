name: API Test with Newman

on: push

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run Collection.json \
            -e Environment.json \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN" \
            --env-var "baseUrl=https://gorest.co.in/public/v2" \
            --reporters cli